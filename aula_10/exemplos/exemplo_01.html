<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="submit" id="formulario">
        <label for="nome">Digite seu nome!</label>
        <input type="text" id="nome"><br><br>
        <label for="email">Digite seu E-mail!</label>
        <input type="email" id="email" nome="email"><br><br>
        <label for="number">Digite sua idade!</label>
        <input type="number" id="idade" nome="idade"><br><br>
        <label for="date">Digite sua data de nascimento!</label>
        <input type="date" id="data_de_nascimento" nome="data_de_nascimento"><br><br>
        <input type="submit" value="Enviar">

        
    </form>
    <script>

const form=document.querySelector("#formulario")
form.addEventListener("submit",
    function(event){
        event.preventDefault()
        const nome = document.querySelector("#nome").value
        const email = document.querySelector("#email").value
        const idade = document.querySelector("#idade").value
        const date=document.querySelector("#data_de_nascimento").value
        


        alert("Formulario preenchido com sucesso! " + nome + " " +email + idade + " " + date)

    }
)
    </script>
    
</body>
</html>
